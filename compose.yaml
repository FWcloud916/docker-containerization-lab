services:
  proxy:
    build:
      context: ./nginx
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/livez"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql://lab:${POSTGRES_PASSWORD:-local-development-only}@db:5432/lab
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=1)
      interval: 2s
      timeout: 2s
      retries: 20

  db:
    build:
      context: ./db
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres-data:

networks:
  frontend:
  backend:
    internal: true
