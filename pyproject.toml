[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-containerization-lab"
version = "0.1.0"
description = "FastAPI, PostgreSQL, and Nginx reference stack for container engineering experiments"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
